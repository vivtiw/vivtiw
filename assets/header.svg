<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Vivek T. — Principal Backend &amp; AI Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#0c2a2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="c1"><rect class="type t1" x="60" y="196" width="760" height="40"/></clipPath>
    <clipPath id="c2"><rect class="type t2" x="60" y="196" width="760" height="40"/></clipPath>
    <clipPath id="c3"><rect class="type t3" x="60" y="196" width="760" height="40"/></clipPath>
    <clipPath id="c4"><rect class="type t4" x="60" y="196" width="760" height="40"/></clipPath>
    <style>
      .name  { font: 700 56px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #f8fafc; }
      .role  { font: 500 22px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .term  { font: 500 21px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #e2e8f0; }
      .prompt{ fill: #2dd4bf; }
      .tag   { font: 600 13px 'SFMono-Regular', Consolas, Menlo, monospace; fill: #5eead4; letter-spacing: 1px; }

      .type { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); }
      .line { opacity: 0; }
      .type { animation: typing 16s steps(48, end) infinite; }
      .line { animation: show 16s linear infinite; }
      .t1, .l1 { animation-delay: 0s; }
      .t2, .l2 { animation-delay: 4s; }
      .t3, .l3 { animation-delay: 8s; }
      .t4, .l4 { animation-delay: 12s; }
      @keyframes typing {
        0%   { transform: scaleX(0); }
        12%  { transform: scaleX(1); }
        100% { transform: scaleX(1); }
      }
      @keyframes show {
        0%    { opacity: 1; }
        24.9% { opacity: 1; }
        25%   { opacity: 0; }
        100%  { opacity: 0; }
      }

      .node  { fill: #2dd4bf; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .p2 { animation-delay: 1s; } .p3 { animation-delay: 2s; }
      @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
      .edge { stroke: #60a5fa; stroke-opacity: .35; stroke-width: 1.5; stroke-dasharray: 6 6; animation: flow 2.5s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @media (prefers-reduced-motion: reduce) {
        .type { animation: none; transform: scaleX(1); }
        .line { animation: none; } .l1 { opacity: 1; }
        .pulse, .edge { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect x="60" y="150" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- network motif: gateways exchanging messages -->
  <g transform="translate(900 40)">
    <line class="edge" x1="60"  y1="50"  x2="200" y2="30"/>
    <line class="edge" x1="60"  y1="50"  x2="130" y2="150"/>
    <line class="edge" x1="200" y1="30"  x2="130" y2="150"/>
    <line class="edge" x1="130" y1="150" x2="240" y2="200"/>
    <line class="edge" x1="130" y1="150" x2="30"  y2="210"/>
    <line class="edge" x1="200" y1="30"  x2="250" y2="110"/>
    <line class="edge" x1="250" y1="110" x2="240" y2="200"/>
    <circle class="node pulse"    cx="60"  cy="50"  r="7"/>
    <circle class="node pulse p2" cx="200" cy="30"  r="6"/>
    <circle class="node pulse p3" cx="130" cy="150" r="10"/>
    <circle class="node pulse"    cx="240" cy="200" r="6"/>
    <circle class="node pulse p2" cx="30"  cy="210" r="6"/>
    <circle class="node pulse p3" cx="250" cy="110" r="5"/>
  </g>

  <text class="tag"  x="60" y="62">BACKEND · DISTRIBUTED SYSTEMS · AI ENGINEERING</text>
  <text class="name" x="58" y="122">Vivek T.</text>
  <text class="role" x="60" y="184">Principal Engineer · 15+ yrs · healthcare interop, security &amp; climate tech</text>

  <g class="line l1" clip-path="url(#c1)"><text class="term" x="60" y="224"><tspan class="prompt">❯ </tspan>building TEFCA / QHIN healthcare data exchange</text></g>
  <g class="line l2" clip-path="url(#c2)"><text class="term" x="60" y="224"><tspan class="prompt">❯ </tspan>shipping agentic AI workflows to production</text></g>
  <g class="line l3" clip-path="url(#c3)"><text class="term" x="60" y="224"><tspan class="prompt">❯ </tspan>Java · Python · Ruby · Kafka · Kubernetes · AWS</text></g>
  <g class="line l4" clip-path="url(#c4)"><text class="term" x="60" y="224"><tspan class="prompt">❯ </tspan>automating the boring parts, end to end</text></g>
</svg>

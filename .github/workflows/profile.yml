name: Refresh profile assets

on:
  schedule:
    - cron: "17 9 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/render_stats.py assets/github-stats.svg

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-dark&color_snake=#2dd4bf&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/snake.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile assets"
          git push
